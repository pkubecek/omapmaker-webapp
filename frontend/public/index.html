    <title>OMapMaker – generátor orientačních map z LiDARu</title>
    <meta name="description" content="OMapMaker automaticky vytvoří orientační mapu z LiDARových dat ČÚZK a GUGiK a z OpenStreetMap. Výstup jako PNG a GeoPackage pro OpenOrienteering Mapper, symboly ISOM 2017-2 a ISSprOM 2019-2." />
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="sNmtapNgDByZVyUn964hmNoFZBY157QqidYX9vSk-ns" />

    <meta property="og:locale" content="cs_CZ" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body style="margin:0;background:#1a1f2e">
    <noscript>
      <div style="color:#e6e6e6;font-family:sans-serif;padding:24px;max-width:720px">
        <h1>OMapMaker – generátor orientačních map</h1>
        <p>OMapMaker z LiDARových dat (ČÚZK, GUGiK) a OpenStreetMap automaticky vygeneruje orientační mapu jako PNG obrázek
          i GeoPackage pro import do OpenOrienteering Mapperu. Podporuje lesní mapy ISOM 2017-2 (1:10 000, 1:15 000)
          a sprintové mapy ISSprOM 2019-2 (1:4 000).</p>
        <p>Pro spuštění aplikace povolte JavaScript.</p>
